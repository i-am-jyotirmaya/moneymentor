limit_req_zone $binary_remote_addr zone=moneymentor_edge:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name app.moneymentor.example;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://web:3000;
    }
}

server {
    listen 443 ssl http2;
    server_name api.moneymentor.example;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        limit_req zone=moneymentor_edge burst=30 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://api:8080;
    }
}

server {
    listen 80;
    server_name app.moneymentor.example api.moneymentor.example;
    return 301 https://$host$request_uri;
}
