name: Deploy API

on:
  # Called by ci only after verification and container builds pass, and only
  # when the push changes API image inputs or the deployment workflows.
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: spndrr-mvp

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate image name
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          echo "uri=${REGISTRY}/${ECR_REPOSITORY}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push ARM64 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/MoneyMentor.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy image to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          # Stable across workflow retries, with a stable email payload.
          DELIVERY_ID=$(printf '%s' "$GITHUB_RUN_ID" | sha256sum | cut -c1-32)
          REMOTE_SCRIPT=$(cat <<EOF
          set -eu
          /opt/spndrr/deploy.sh '$IMAGE'
          CONTAINERS=\$(docker ps --filter 'ancestor=$IMAGE' --format '{{.ID}}')
          set -- \$CONTAINERS
          if [ \$# -ne 1 ]; then
            echo 'Expected exactly one running container for the deployed API image.'
            exit 1
          fi
          docker exec "\$1" dotnet /app/operations/MoneyMentor.Operations.dll email-smoke-test --delivery-id '$DELIVERY_ID'
          EOF
          )
          PARAMS=$(jq -nc --arg cmd "$REMOTE_SCRIPT" '{commands:[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed: $STATUS"
            exit 1
          fi
