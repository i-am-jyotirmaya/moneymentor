name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: gitleaks/gitleaks-action@v3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/setup@v2
        with:
          version: next-12
          cache: true
          cache-dependency-path: apps/web/pnpm-lock.yaml
          runtime: node@24
      - run: dotnet restore MoneyMentor.slnx
      - run: dotnet build MoneyMentor.slnx --no-restore --configuration Release --verbosity minimal
      - run: dotnet test apps/api/MoneyMentor.Application.Tests/MoneyMentor.Application.Tests.csproj --no-build --configuration Release --verbosity minimal
      - run: dotnet test apps/api/MoneyMentor.Api.IntegrationTests/MoneyMentor.Api.IntegrationTests.csproj --no-build --configuration Release --verbosity minimal
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e
        working-directory: apps/web

  containers:
    name: container (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/MoneyMentor.Api/Dockerfile
            buildArgs: ""
          - name: web
            dockerfile: apps/web/Dockerfile
            buildArgs: >-
              --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.spndrr.example
              --build-arg NEXT_PUBLIC_SUPPORT_EMAIL=support@spndrr.example
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.name }} production image
        run: >-
          docker build
          ${{ matrix.buildArgs }}
          --file ${{ matrix.dockerfile }}
          --tag spndrr-${{ matrix.name }}:ci
          .
