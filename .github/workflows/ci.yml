name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push must not interrupt an API deployment already in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api_changed: ${{ steps.api-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect API deployment changes
        id: api-changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare the entire push, including multi-commit pushes and deletions.
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE=$(git hash-object -t tree /dev/null)
          elif ! git cat-file -e "${BEFORE}^{commit}"; then
            git fetch --no-tags origin "$BEFORE"
          fi

          changed=false
          git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
            apps/api deploy/aws MoneyMentor.slnx .dockerignore \
            global.json Directory.Build.props Directory.Build.targets \
            Directory.Packages.props NuGet.Config nuget.config \
            .github/workflows/ci.yml .github/workflows/deploy-api.yml || {
              status=$?
              if [[ "$status" -ne 1 ]]; then exit "$status"; fi
              changed=true
            }
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check metrics collector starts with production configuration
        run: |
          COLLECTOR=$(docker run -d \
            -e AWS_REGION=ap-south-1 \
            -e AWS_ACCESS_KEY_ID=collector-config-check \
            -e AWS_SECRET_ACCESS_KEY=collector-config-check \
            -v "$PWD/deploy/aws/otel-collector.yaml:/etc/otel-collector.yaml:ro" \
            amazon/aws-otel-collector:v0.50.0 \
            --config=/etc/otel-collector.yaml)
          trap 'docker rm -f "$COLLECTOR" >/dev/null 2>&1 || true' EXIT
          sleep 5
          docker logs "$COLLECTOR"
          test "$(docker inspect --format '{{.State.Running}}' "$COLLECTOR")" = true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/setup@v2
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
      - run: dotnet restore MoneyMentor.slnx
      - run: dotnet build MoneyMentor.slnx --no-restore --configuration Release --verbosity minimal
      - run: dotnet test apps/api/MoneyMentor.Application.Tests/MoneyMentor.Application.Tests.csproj --no-build --configuration Release --verbosity minimal
      - run: dotnet test apps/api/MoneyMentor.Api.IntegrationTests/MoneyMentor.Api.IntegrationTests.csproj --no-build --configuration Release --verbosity minimal
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Test shared speech runtime
        run: node --test --test-isolation=none packages/spndrr-speech/tests/*.test.ts
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e
        working-directory: apps/web

  containers:
    name: container (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/MoneyMentor.Api/Dockerfile
            buildArgs: ""
          - name: web
            dockerfile: apps/web/Dockerfile
            buildArgs: >-
              --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.spndrr.example
              --build-arg NEXT_PUBLIC_SUPPORT_EMAIL=support@spndrr.example
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.name }} production image
        run: >-
          docker build
          ${{ matrix.buildArgs }}
          --file ${{ matrix.dockerfile }}
          --tag spndrr-${{ matrix.name }}:ci
          .

  deploy-api:
    name: Deploy API
    needs: [verify, containers]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.outputs.api_changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
