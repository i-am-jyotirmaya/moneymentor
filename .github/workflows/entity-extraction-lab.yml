name: Entity extraction lab

on:
  pull_request:
    paths:
      - 'tools/entity-extraction-lab/**'
      - '.github/workflows/entity-extraction-lab.yml'
  push:
    branches: ['feat/local-entity-extraction-lab']
    paths:
      - 'tools/entity-extraction-lab/**'
      - '.github/workflows/entity-extraction-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/entity-extraction-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python lab.py validate
