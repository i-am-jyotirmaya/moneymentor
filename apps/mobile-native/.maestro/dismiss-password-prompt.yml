appId: com.spndrr.app.rn.e2e
---
# iOS can expose the Home accessibility tree before its delayed password alert.
# A second lookup handles that transition without disabling production autofill.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Not Now'
          optional: true
          retryTapIfNoChange: true
      - tapOn:
          text: 'Not Now'
          optional: true
          retryTapIfNoChange: true
