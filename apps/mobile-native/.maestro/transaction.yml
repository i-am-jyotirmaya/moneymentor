appId: com.spndrr.app.native.e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Sign in'
    timeout: 30000
- tapOn:
    id: email-input
- inputText: qa@example.test
- tapOn:
    id: password-input
- inputText: fixture-only
- hideKeyboard
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: 'Add a transaction'
    timeout: 30000
- takeScreenshot: native-home
- tapOn: 'Add a transaction'
- tapOn: 'Enter details'
- tapOn:
    id: amount-input
- inputText: '40.29'
- hideKeyboard
- takeScreenshot: native-composer
- tapOn: 'Category: Choose category or subcategory'
- tapOn:
    id: category-search
- inputText: 'Groceries'
- hideKeyboard
- tapOn: 'Food / Groceries,.*'
- tapOn: 'Account: Choose payment account'
- takeScreenshot: native-accounts
- tapOn: 'Kotak upi, Credit card'
- scrollUntilVisible:
    element: 'Save transaction'
    direction: DOWN
- tapOn: 'Save transaction'
- assertVisible: 'Transaction saved'
- assertVisible: 'Kotak upi.*'
- takeScreenshot: native-receipt
- tapOn: 'Edit saved transaction'
- tapOn:
    id: amount-input
- eraseText
- inputText: '45.50'
- hideKeyboard
- scrollUntilVisible:
    element: 'Save changes'
    direction: DOWN
- tapOn: 'Save changes'
- assertVisible: 'Changes saved'
- takeScreenshot: native-edited
- tapOn: 'Done'
- tapOn: 'Done'
- tapOn: 'Add a transaction'
- tapOn:
    id: assistant-input
- inputText: 'coffee'
- hideKeyboard
- tapOn: 'Send & track'
- assertVisible: 'How much did you spend?'
- tapOn:
    id: assistant-input
- inputText: '30'
- hideKeyboard
- tapOn: 'Send & track'
- assertVisible: 'Transaction saved'
- tapOn: 'Done'
- tapOn: 'Add a transaction'
- tapOn:
    id: assistant-input
- inputText: 'simulate failure'
- hideKeyboard
- tapOn: 'Send & track'
- assertVisible: 'Check recent transactions'
- assertNotVisible: 'Send & track'
- tapOn: 'Check recent transactions'
- tapOn: 'Sign out'
- tapOn: 'Sign out and clear draft'
- assertVisible: 'Sign in'
